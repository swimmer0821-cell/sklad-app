  const by = {}, order = [];
  list.forEach(x => { if (typeof x.q !== 'number' || !isFinite(x.q)) return; const u = x.u || ''; if (!(u in by)) { by[u] = 0; order.push(u); } by[u] += x.q; });
  if (!order.length) return '';

function trText(s) {
  if (UZ[s] != null) return UZ[s];
  for (const [re, f] of UZR) { const m = s.match(re); if (m) return f(...m); }
  return null;
}
function trCore(core, phrases) {
  let r = trText(core);
  if (r == null) { const p = core.match(/^([^А-Яа-яЁёA-Za-z«]+)([\s\S]+)$/); if (p) { const r2 = trText(p[2]); if (r2 != null) r = p[1] + r2; } }
  if (r == null && core.includes(' · ')) { const parts = core.split(' · ').map(x => trCore(x, false) ?? x); if (parts.join(' · ') !== core) r = parts.join(' · '); }
  if (r == null && phrases) { let x = core; PHR_UZ.forEach(([a, b]) => { x = x.split(a).join(b); }); if (x !== core) r = x; }
  return r;
}
function trNode(t) {
  const raw = t.nodeValue; if (!/[А-Яа-яЁё]/.test(raw)) return;
  const m = raw.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const par = t.parentElement, phrases = !!(par && par.closest('.pre,.msg,.hint,.sub,h3'));
  const r = trCore(m[2], phrases);
  if (r != null && r !== m[2]) t.nodeValue = m[1] + r + m[3];
}
function translateTree(root) {
  if (LANG !== 'uz' || !root) return;
  if (root.nodeType === 3) return trNode(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const list = [];
  while ((n = w.nextNode())) list.push(n);
  list.forEach(trNode);
  if (root.querySelectorAll) root.querySelectorAll('[placeholder]').forEach(el => { const r = trCore(el.placeholder.replace(/^🔍 /, ''), false); if (r) el.placeholder = '🔍 ' + r; });
}
new MutationObserver(ms => { if (LANG !== 'uz') return; ms.forEach(m => m.addedNodes.forEach(translateTree)); })
  .observe(document.body, {childList: true, subtree: true});
function setLang(l) {
  LANG = l; ls('sklad_lang', l); document.documentElement.lang = l === 'uz' ? 'uz' : 'ru';
  document.title = l === 'uz' ? 'SUB PROFI ombori' : CFG.APP_NAME;
  render();
}

/* ---------------- связь с сервером ---------------- */
async function api(action, data, id) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), CFG.TIMEOUT_SEC * 1000);
  let r;
  try {
    r = await fetch(CFG.API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, signal: ctrl.signal,
      body: JSON.stringify({action, data: data || {}, rid: id, initData: TG ? TG.initData : '', token: TG ? '' : S.token})});
  } catch (e) {
    throw mkErr(e.name === 'AbortError' ? 'Сервер не ответил за ' + CFG.TIMEOUT_SEC + ' секунд.' : 'Нет связи с интернетом.', 'net');
  } finally { clearTimeout(timer); }
  let j;
  try { j = await r.json(); } catch (e) { throw mkErr('Сервер ответил непонятно (код ' + r.status + ').', 'net'); }
  if (!j.ok) throw mkErr(j.error || 'Неизвестная ошибка', j.auth === false ? 'auth' : '');
  return j;
}
function mkErr(m, kind) { const e = new Error(m); e.kind = kind; return e; }

// Запрос с индикатором загрузки и кнопкой «Повторить» при обрыве связи.
// Для записи номер запроса (rid) один и тот же при повторе — сервер не создаст дубль.
async function call(action, data, o) {
  o = o || {};
  const id = o.write ? rid() : undefined;
  for (;;) {
    showLoader(o.msg || 'Загрузка…', o.write);
    try { const j = await api(action, data, id); hideLayer(); return j; }
    catch (e) {
      hideLayer();
      if (e.kind === 'auth') { authFail(e.message); throw e; }
      if (e.kind === 'net') { if (await netDialog(e.message, o.write)) continue; }
      throw e;
    }
  }
}

function drawKeypad() {

function kpPress(a) {
  let v = KP.v;
  if (/^\d$/.test(a)) { if (v.replace(',', '').length < 9) v = (v === '0' ? '' : v) + a; }
  else if (a === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
  else if (a === 'del') v = v.slice(0, -1);
  else if (a === 'clr') v = '';
  else if (a === 'p1' || a === 'm1') {
    const x = Math.max(0, r3((num(v) || 0) + (a === 'p1' ? 1 : -1)));
    v = String(x).replace('.', ',');
  } else if (a === 'cancel') { KP = null; hideLayer(); return; }
  else if (a === 'ok') { setV(KP.key, v.replace(/,$/, '')); KP = null; hideLayer(); render(); return; }
  else return;
  KP.v = v; drawKeypad();
}

function available(it, bs, sel) {
  if (!it) return null;
  if (isPack(it) || (bs && !bs.length)) return stockQ(it.n);

  return sel === 'auto' ? r3(bs.reduce((s, b) => s + b.q, 0)) : (bs[sel] ? bs[sel].q : 0);

function allocText(bs, q) {
  let rest = q; const out = [];
  for (const b of bs) { if (rest <= 1e-9) break; const t = Math.min(rest, b.q); out.push(b.b + ': ' + fmt(r3(t))); rest -= t; }
  return out.join(', ');

        </div>`;
      });

      if (IR.length > 1) {
        const facts = IR.map((r, i) => F.facts[i]).filter(f => f !== undefined && f !== '').map(num).filter(v => !isNaN(v));
        h += '</div>' + totalRow([{q: r3(IR.reduce((t, r) => t + (r.q || 0), 0)), u: it.u}], 'Итого по учёту') +
          (facts.length ? totalRow([{q: r3(facts.reduce((t, v) => t + v, 0)), u: it.u}], 'Итого факт (' + facts.length + ' из ' + IR.length + ')') : '') + '<div>';
      }

function vInv_valid() {
  const it = F.item, m = {}, miss = [], block = [], warn = [], rows = invRows(), sum = [], data = [];
  if (!it) { m.item = 1; miss.push('товар'); }
  rows.forEach((r, i) => {
    const f = F.facts[i]; if (f === undefined || f === '') return;
    const x = num(f); if (!(x >= 0)) { block.push('Неверный факт'); return; }
    const d = r3(x - r.q);
    data.push({b: r.b, fact: f});
    sum.push([r.b ? 'Партия ' + r.b : 'Без партии', 'учёт ' + fmt(r.q) + ' → факт ' + fmt(x) + ' ' + it.u + (d === 0 ? ' · совпадает' : d < 0 ? ' · недостача ' + fmt(-d) : ' · излишек ' + fmt(d))]);
  });
  if (it && !data.length) { miss.push('факт хотя бы по одной партии'); }
  if (sum.some(s => s[1].includes('недостача'))) warn.push('Недостача будет записана в Расход с причиной «инвентаризация».');
  return {m, miss, block, warn, sum: it ? [['Операция', 'Инвентаризация'], ['Товар', it.n], ...sum] : [], action: 'inv', data: it ? {item: it.n, rows: data} : null};

      const all = S.stock.filter(s => s.g === g), pos = all.filter(hasQ), warn = all.filter(isWarn).length;
      return `<button class="tile" data-a="sg:${gi + 1}"><span class="ic">${G_ICON[g] || '📁'}</span>${esc(g)}
        <small>с остатком: ${pos.length} из ${all.length}</small>${warn ? `<small style="color:var(--bad);font-weight:800">⚠ ${warn}</small>` : ''}</button>`;
    }).join('') + '</div>';
    return;
  }
  // 3) группа → разделы
  bar.innerHTML = `<div class="chips"><button class="chip" data-a="sg:0">← Все группы</button>${zeroChip}</div><h2 style="margin:16px 0 4px">${G_ICON[F.g] || ''} ${esc(F.g)}</h2>`;
  const rows = S.stock.map((s, i) => ({s, i, sec: stockSec(s)})).filter(x => x.s.g === F.g && (F.all || hasQ(x.s)));
  if (!rows.length) { box.innerHTML = '<div class="empty">Нет позиций с остатком. Нажмите «Показывать нулевые».</div>'; return; }
  const secs = [...new Set(rows.map(x => x.sec[0]))].sort((a, b) => secIdx(a) - secIdx(b));
  const one = secs.length === 1;
  box.innerHTML = secs.map(sec => {
    const list = rows.filter(x => x.sec[0] === sec), key = F.g + '|' + sec, open = one || F.sec[key];
    const warn = list.filter(x => isWarn(x.s)).length;
    const head = one ? '' : `<button class="opt" data-a="ssec:${esc(key)}" style="background:var(--pri-bg);border-color:var(--pri)"><div style="flex:1"><div class="nm">${open ? '▾' : '▸'} ${esc(sec || 'Прочее')}</div>
      <div class="sub">${list.length} поз.${warn ? ` · <span class="tag bad">⚠ ${warn}</span>` : ''}</div></div><div class="q">${sumText(list.map(x => x.s))}</div></button>`;
    if (!open) return head;
    const subs = [...new Set(list.map(x => x.sec[1]))].sort((a, b) => secIdx(a) - secIdx(b));
    const body = subs.map(sub => {
      const sl = list.filter(x => x.sec[1] === sub);
      return (sub && subs.length > 1 ? `<div class="hint" style="margin:10px 4px 6px;font-weight:800">${esc(sub)} · ${sl.length} поз.</div>` : '') + sl.map(x => stockRow(x.s, x.i)).join('');
    }).join('');
    return head + `<div style="${one ? '' : 'margin:0 0 16px 14px'}">${body}</div>`;
  }).join('') + totalRow(rows.map(({s}) => ({q: s.q, u: s.u})), 'Итого по группе');
}

/* ================= ВНИМАНИЕ ================= */
function vAttn() {
  let h = '<h2>Проверки</h2><div class="card">' + S.checks.map(c => `<div class="sel" style="padding:8px 0;border-bottom:1px solid #e3e6eb"><span>${esc(c.t)}</span>
    <b style="font-size:24px;color:${c.n > 0 ? 'var(--bad)' : 'var(--ok)'}">${fmt(c.n)}</b></div>`).join('') + '</div>';
  const uq = x => { const st = S.stock.find(s => s.n === x.n); return {q: x.q, u: st ? st.u : ''}; };
  const soon = S.expiry.filter(x => x.d <= CFG.EXPIRY_WARN_DAYS), later = S.expiry.filter(x => x.d > CFG.EXPIRY_WARN_DAYS);
  const ex = x => `<div class="opt${x.d < 0 ? ' expired' : ''}" style="cursor:default"><div><div class="nm">${x.d < 0 ? '⛔' : '⚠'} ${esc(x.n)}</div><div class="sub">партия ${esc(x.b)} · до ${esc(x.exp)} · ${x.d < 0 ? '<b style="color:var(--bad)">просрочена</b>' : 'осталось ' + x.d + ' дн'}</div></div><div class="q">${fmt(x.q)} ${esc(uq(x).u)}</div></div>`;
  h += `<h2>Сроки годности меньше ${CFG.EXPIRY_WARN_DAYS} дней</h2>` + (soon.length ? soon.map(ex).join('') + totalRow(soon.map(uq)) : '<div class="msg ok">✅ Таких партий нет</div>');
  if (later.length) h += `<h2>Сроки ${CFG.EXPIRY_WARN_DAYS}–60 дней</h2>` + later.map(ex).join('') + totalRow(later.map(uq));
  const pr = S.stock.filter(s => s.st && s.st !== 'ок' && s.st !== 'нет в наличии');
  h += '<h2>Товары с проблемами</h2>' + (pr.length ? pr.map(s => `<div class="opt" style="cursor:default"><div><div class="nm">${esc(s.n)}</div><div class="sub"><span class="tag ${s.st.includes('⛔') ? 'bad' : 'warn'}">${esc(s.st)}</span></div></div><div class="q">${fmt(s.q)} ${esc(s.u)}</div></div>`).join('') + totalRow(pr.map(s => ({q: s.q, u: s.u}))) : '<div class="msg ok">✅ Проблем нет</div>');
  if (S.admin) {
    if (F.pend === undefined) { F.pend = null; loadPend(); }
    OPTS.pend = F.pend || [];
    h += '<h2>Новые позиции на подтверждение</h2>' + (F.pend === null ? '<div class="hint">Загрузка…</div>'
      : F.pend.length ? F.pend.map((p, i) => `<div class="card"><div class="nm" style="font-size:21px;font-weight:700">${esc(p.name)}</div>
        <div class="sub">${esc(p.group)} · ${esc(p.unit)}${p.srok !== '' ? ' · ' + esc(p.srok) + ' мес' : ''} · ${esc(p.date)}</div><div class="sub">Предложил(а): ${esc(p.who)}</div>
        <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn bad" data-a="pno:${i}">Отклонить</button><button class="btn" data-a="pedit:${i}">Изменить и добавить</button><button class="btn ok" data-a="pyes:${i}">Добавить</button></div></div>`).join('')
      : '<div class="msg ok">' + (F.pendErr ? esc(F.pendErr) : 'Заявок нет') + '</div>');
  }
  if (S.admin) h += `<h2>Руководитель</h2><div class="card"><button class="btn wide" data-a="last">Показать последние записи</button><div id="lastlist" class="list-sm" style="margin-top:12px">${F.last ? F.last.map((t, i) =>
    `<div class="sel" style="padding:10px 0;border-bottom:1px solid #e3e6eb"><span style="flex:1">${i + 1}. ${esc(t)}</span><button class="btn bad" data-a="del:${i + 1}">Удалить</button></div>`).join('') || 'Записей нет' : ''}</div></div>`;
  return h;
}

/* ================= ВХОД (вне Telegram) ================= */
function vLogin() {
  if (F.names) {
    OPTS.names = F.names;
    return `<div class="card"><div class="lbl">Кто вы?</div><div class="chips">${F.names.map((n, i) => `<button class="chip" data-a="lname:${i}">${esc(n)}</button>`).join('')}</div>
      <div style="margin-top:16px"><button class="btn wide" data-a="lnew">Меня нет в списке — ввести имя</button></div></div>`;
  }
  const p = F.pin || '';
  return `<div class="card" style="max-width:520px;margin:20px auto"><div class="lbl">Введите ПИН-код</div>
    <div class="pinbox">${p ? '•'.repeat(p.length) : '&nbsp;'}</div>
    <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => `<button class="key" data-a="pin:${d}">${d}</button>`).join('')}
      <button class="key alt" data-a="pin:clr">Очистить</button><button class="key" data-a="pin:0">0</button><button class="key alt" data-a="pin:del">⌫</button></div>
    <button class="btn ok wide" style="margin-top:14px;min-height:76px" data-a="pin:go" ${p ? '' : 'disabled'}>Войти</button>
    <div class="hint">ПИН-код — тот же, что для подключения к боту. Спросите у руководителя.</div></div>`;
}
async function loginStep(name) {
  try {
    showLoader('Проверяю…');
    const r = await fetch(CFG.API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action: 'login', data: {pin: F.pin, name: name || ''}})});
    const j = await r.json(); hideLayer();
    if (!j.ok) { F.pin = ''; F.names = null; render(); await dialog(`<div class="big-bad">Ошибка</div><div class="msg bad">${esc(j.error)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]); return; }
    if (j.needName) { F.names = j.names; render(); return; }
    S.token = j.token; ls('sklad_token', j.token); start();
  } catch (e) { hideLayer(); if (await netDialog('Нет связи с интернетом.', false)) loginStep(name); }
}
function authFail(m) {
  if (TG) { SCR = 'err'; F = {err: m}; render(); return; }
  S.token = ''; ls('sklad_token', null); go('login'); dialog(`<div class="msg bad">${esc(m)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]);
}
function vErr() { return `<div class="card"><div class="big-bad">Нет доступа</div><div class="msg bad">${esc(F.err || '')}</div><button class="btn pri wide" style="margin-top:16px" data-a="retry">↻ Повторить</button></div>`; }

/* ================= ДЕЙСТВИЯ ПО НАЖАТИЮ ================= */
const ACT = {
  back: () => back(),
  go: s => go(s),
  opt: (key, i) => {
    const was = F[key]; F[key] = OPTS[key][+i]; F.dirty = true;
    if (key === 'type' && SCR === 'out') {
      F.reason = '';
      if ((was === PACK_OUT) !== (F[key] === PACK_OUT)) { F.item = null; F.bs = null; F.sel = 0; F.qty = ''; F.fprod = null; }
    }
    render();
  },
  clr: key => { F[key] = ''; render(); },
  kp: (key, int, el) => keypad(key, el.dataset.t, el.dataset.u, int === '1'),
  pick: (key, i) => onPick(key, S.items[+i]),
  recpick: (key, k) => onPick(key, OPTS['rec_' + key][+k]),
  unpick: key => { if (/^raw_\d+$/.test(key)) { const k = key.slice(4); F[key] = null; F['bs_' + k] = null; F['sel_' + k] = 0; F['rq_' + k] = ''; render(); return; }
    F[key] = null; if (key === 'fprod') { render(); return; } if (key === 'item' && SCR !== 'prod' || key === 'raw') { F.bs = null; F.sel = 0; F.facts = {}; } F.qty = ''; if (key === 'raw') F.rawQty = ''; F.bManual = false; render(); },
  unloadgo: () => { go('prod', {mode: 'unload'}); },
  recedit: i => { F.sel = +i; render(); window.scrollTo(0, 0); },
  recback: () => { F.sel = null; render(); },
  hist: sh => go('rec', {sheet: sh}),
  recsheet: sh => { F.sheet = sh; F.sel = null; render(); window.scrollTo(0, 0); },
  recsave: () => recSave(),
  recdel: i => recDel(+i),
  recreload: () => { F.list = null; render(); recLoad(); },
  pmode: m => { go('prod', {mode: m}); },
  lsel: i => { F.load = +i; F.qty = ''; F.brak = ''; F.dirty = true; render(); },
  bsel: v => { F.sel = v === 'auto' ? 'auto' : +v; F.dirty = true; render(); },
  xsel: (k, v) => { F['sel_' + k] = v === 'auto' ? 'auto' : +v; F.dirty = true; render(); },
  xadd: () => { F.xn = (F.xn || 0) + 1; F.dirty = true; render(); },
  mixauto: () => { F.mixManual = false; F.rawTotal_auto = undefined; F.rawTotal = ''; render(); },
  xdel: k => {   // убрать позицию k, остальные сдвинуть
    k = +k; const n = F.xn || 0;
    for (let i = k; i < n; i++) ['raw_', 'bs_', 'sel_', 'rq_', 'q_raw_'].forEach(p => { F[p + i] = F[p + (i + 1)]; });
    ['raw_', 'bs_', 'sel_', 'rq_', 'q_raw_'].forEach(p => { delete F[p + n]; }); F.xn = n - 1; F.dirty = true; render();
  },
  setdate: d => { F.date = d; render(); },
  editbatch: () => textInput('Номер партии', F.batch, v => { F.batch = v.replace(/;/g, ','); F.bManual = !!v; F.dirty = true; }, 'Как на этикетке или в накладной, например С-4'),
  otherfrom: () => textInput('Откуда / поставщик', F.from, v => { F.from = v; }),
  otherreason: () => textInput(REASON_REQ.includes(F.type) ? 'Причина' : 'Кому / причина', F.reason, v => { F.reason = v; F.dirty = true; }),
  same: i => { const r = invRows()[+i]; F.facts[i] = String(r.q).replace('.', ','); F.dirty = true; render(); },
  confirm: () => confirmWrite(),
  undo: () => doUndo(),
  sg: i => { F.g = ['Все'].concat(S.groups)[+i]; ls('sklad_sg', F.g); render(); window.scrollTo(0, 0); },
  ssec: k => { F.sec[k] = !F.sec[k]; if (!F.sec[k]) delete F.sec[k]; ls('sklad_sec', JSON.stringify(F.sec)); drawStockList(); },
  sall: () => { F.all = !F.all; render(); },
  sopen: async i => {
    const s = S.stock[+i]; if (F.open[i]) { delete F.open[i]; drawStockList(); return; }
    const it = itemBy(s.n); if (isPack(it)) { F.open[i] = []; drawStockList(); return; }
    F.open[i] = await loadBatches(s.n); drawStockList();
  },
  last: async () => { try { const j = await call('last', {n: 15}, {msg: 'Загружаю…'}); F.last = j.data; render(); } catch (e) { if (e.kind !== 'auth') dialog(`<div class="msg bad">${esc(e.message)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]); } },
  del: async n => {
    if (!(await ask('Удалить запись №' + n + '?\n' + F.last[+n - 1], 'Удалить', 'Нет'))) return;
    try { const j = await call('del', {n}, {write: true, msg: 'Удаляю…'}); S.stock = j.stock || S.stock; S.bc = {}; if (j.loads) S.loads = j.loads; F.last = null; render();
      await dialog(`<div class="big-ok">Удалено</div><div class="pre">${esc(j.text)}</div>`, [{t: 'Хорошо', cls: 'pri', v: 1}]); refreshQuiet(); }
    catch (e) { if (e.kind !== 'auth') dialog(`<div class="big-bad">Не удалено</div><div class="msg bad">${esc(e.message)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]); }
  },
  pin: d => {
    if (d === 'go') return loginStep('');
    F.pin = F.pin || '';
    if (d === 'del') F.pin = F.pin.slice(0, -1); else if (d === 'clr') F.pin = ''; else if (F.pin.length < 12) F.pin += d;
    render();
  },
  lname: i => loginStep(OPTS.names[+i]),
  lnew: () => textInput('Ваше имя', '', v => { if (v) loginStep(v); }),
  logout: async () => { if (!(await ask('Выйти из приложения на этом устройстве?', 'Выйти', 'Нет'))) return; try { await api('logout', {}); } catch (e) {} S.token = ''; ls('sklad_token', null); S.who = ''; go('login'); },
  newitem: key => newItem(key),
  pyes: async i => {
    const p = OPTS.pend[+i]; if (!p) return;
    try { const j = await call('item_decide', {row: p.row, ok: true}, {write: true, msg: 'Записываю…'}); F.pend = j.items; await refreshQuiet(); render();
      await dialog(`<div class="big-ok">Добавлено</div><div class="pre">${esc(j.text)}</div>`, [{t: 'Хорошо', cls: 'pri', v: 1}]); }
    catch (e) { if (e.kind !== 'auth') { F.pend = undefined; render(); dialog(`<div class="big-bad">Не сохранено</div><div class="msg bad">${esc(e.message)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]); } }
  },
  pedit: i => { const p = OPTS.pend[+i]; if (!p) return;
    newItem('', {row: p.row, name: p.name, groups: S.groups, group: p.group, unit: p.unit, uSet: true, srok: String(p.srok), min: String(p.min)}); },
  pno: async i => {
    const p = OPTS.pend[+i]; if (!p || !(await ask('Отклонить заявку?\n' + p.name, 'Отклонить', 'Нет'))) return;
    try { const j = await call('item_decide', {row: p.row, ok: false}, {write: true, msg: 'Записываю…'}); F.pend = j.items; render(); }
    catch (e) { if (e.kind !== 'auth') { F.pend = undefined; render(); dialog(`<div class="big-bad">Не сохранено</div><div class="msg bad">${esc(e.message)}</div>`, [{t: 'Понятно', cls: 'pri', v: 1}]); } }
  },
  retry: () => start(),
  lang: () => setLang(LANG === 'uz' ? 'ru' : 'uz')
};
document.addEventListener('click', e => {
  const k = e.target.closest('[data-kp]'); if (k && KP) { kpPress(k.dataset.kp); return; }
  const ni = e.target.closest('[data-ni]'); if (ni && NI) { niPress(ni.dataset.ni); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const [a, ...args] = el.dataset.a.split(':');
  if (SCR === 'prod' && F.mode === 'pack' && F.recipe && (['bsel', 'xsel', 'xadd', 'xdel'].includes(a) ||
      (['pick', 'recpick', 'unpick'].includes(a) && /^raw/.test(args[0])) || (a === 'kp' && /^(rawQty|rq_)/.test(args[0])))) F.mixManual = true;
  if (ACT[a]) ACT[a](...args, el);
});
document.addEventListener('input', e => {
  const s = e.target.dataset.search;
  if (s === 'stockq') { F.q = e.target.value; drawStockList(); return; }
  if (e.target.dataset.recq) { F.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-recq]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (s) { F['q_' + s] = e.target.value; drawPickRes(s); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.date === 'exp') { F.exp = e.target.value || ''; F.dirty = true; render(); return; }
  if (e.target.dataset.date) { const v = e.target.value; if (v) { F.date = v > today() ? today() : v; F.dirty = true; render(); } }
});

/* ================= ЗАПУСК ================= */
function apply(d) {
  Object.assign(S, {who: d.who, admin: d.admin, items: d.items, stock: d.stock, checks: d.checks, expiry: d.expiry,
    loads: d.loads || [], lastBatch: d.lastBatch || {}, recent: d.recent || {from: [], to: {}}, types: d.types, groups: d.groups});
}
async function refreshQuiet() { try { apply((await api('init', {})).data); if (SCR === 'home' || SCR === 'attn') render(); } catch (e) {} }
async function start() {
  if (CFG.API_URL.indexOf('/exec') < 0) { SCR = 'err'; F = {err: 'В настройках не указан адрес API_URL.'}; render(); return; }
  if (!TG && !S.token) { go('login'); return; }
  try { apply((await call('init', {}, {msg: 'Загружаю склад…'})).data); go('home'); }
  catch (e) { if (e.kind === 'auth') return; SCR = 'err'; F = {err: e.message}; render(); }
}
setInterval(() => { if (SCR === 'home' && !layer.innerHTML) render(); }, 60000); // обновляет таймер «Отменить»
// Автообновление (с 23.10.2026): если на сайте новая версия приложения — перезагрузить, когда открыт главный экран и ничего не вводится
const APP_VER = '2026-10-27-fruit-cubes2';
async function checkUpdate() {
  if (SCR !== 'home' || layer.innerHTML || (F && F.dirty)) return;
  try {
    const t = await (await fetch('./index.html?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/const APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER) location.reload();
  } catch (e) {}
}
setInterval(checkUpdate, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
document.documentElement.lang = LANG; if (LANG === 'uz') document.title = 'SUB PROFI ombori';
start();
if ('serviceWorker' in navigator && !TG) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {}));
</script>
</body>
